# Snapshot of Chin's kitty configuration: current-theme.conf + /etc/xdg/kitty/kitty.conf.
# Run the locally built foot with --config=<this file>; no default config is replaced.
font=JetBrains Mono:size=11
dpi-aware=no
pad=0x0
app-id=foot-kitty-compare

[csd]
preferred=none

[cursor]
style=block
blink=yes
# System cursor-blink-time is 1200ms per full cycle.
blink-rate=600

[colors-dark]
alpha=0.70
alpha-mode=matching
foreground=dcd7ba
background=1f1f28
selection-foreground=c8c093
selection-background=2d4f67
cursor=1f1f28 c8c093
regular0=090618
regular1=c34043
regular2=76946a
regular3=c0a36e
regular4=7e9cd8
regular5=957fb8
regular6=6a9589
regular7=c8c093
bright0=727169
bright1=e82424
bright2=98bb6c
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=dcd7ba

[tab-bar]
enabled=yes
position=bottom
min-tabs=2
style=fade
background=1f1f28
active-foreground=1f1f28
active-background=76946a
inactive-foreground=717c7c
inactive-background=2a2a37
active-font-style=bold-italic
inactive-font-style=normal
padding=0
max-title-length=1024
# Match idle kitty labels; its Python-based status formatting is not evaluated.
title-template={title}
active-title-template={title}

[key-bindings]
tab-new=Control+Shift+t
tab-close=Control+Shift+w
tab-prev=Control+Shift+h
tab-next=Control+Shift+l
tab-select-1=Control+Shift+1
tab-select-2=Control+Shift+2
tab-select-3=Control+Shift+3
tab-select-4=Control+Shift+4
tab-select-5=Control+Shift+5
tab-select-6=Control+Shift+6
tab-select-7=Control+Shift+7
tab-select-8=Control+Shift+8
tab-select-9=Control+Shift+9
